name: Temporary Intel macOS DMG
'on':
  push:
    branches:
    - temp/platform-progress-macos-intel
  workflow_dispatch: {}
permissions:
  contents: read
env:
  IINA_VERSION: v1.4.4
  IINA_SHA256: dd0fc0bd4b37fb57a1c8d30d6e3201b3a64bafd29959fe56953964613237beb1
  SIGNING_AVAILABLE: 'false'
jobs:
  build-macos:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          arch_label: x64
          runtime: osx-x64
          ffmpeg_url: https://www.osxexperts.net/ffmpeg80intel.zip
          voikko_url: https://github.com/SubtitleEdit/support-files/releases/download/voikko-4.3-fi-2024-06/libvoikko-4.3.3-macos-x64.zip
          voikko_sha256: fbd458122536708192a4f56f98f34d28a399547e628ce17d14d4cc6534b7a62b
          ffmpeg_sha256: 2d24d22db78c87f394a5822867acd5c5dc5e762cd261a44bd26923f3a5af3e07
          dmg_format: UDZO
          expected_arch: x86_64
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Extract version from Se.cs
      run: "set -e\nline=$(grep -E 'public[[:space:]]+static[[:space:]]+string[[:space:]]+Version[[:space:]]*\\{' src/ui/Logic/Config/Se.cs)\n\
        version_string=$(printf '%s' \"$line\" | sed -E 's/.*\"v([^\"]+)\".*/\\1/')\nnumeric_part=\"${version_string%%-*}\"\
        \nsuffix=\"\"\ncase \"$version_string\" in\n  *-*) suffix=\"${version_string#*-}\" ;;\nesac\ndot_count=$(printf '%s'\
        \ \"$numeric_part\" | tr -cd '.' | wc -c | tr -d ' ')\ncase \"$dot_count\" in\n  0) numeric_part=\"${numeric_part}.0.0\"\
        \ ;;\n  1) numeric_part=\"${numeric_part}.0\" ;;\nesac\nrevision=$(printf '%s' \"$suffix\" | grep -oE '[0-9]+$' ||\
        \ true)\nrevision=${revision:-0}\napp_ver_full=\"${numeric_part}.${revision}\"\necho \"APP_VER_DISPLAY=$version_string\"\
        \ >> \"$GITHUB_ENV\"\necho \"APP_VER_FULL=$app_ver_full\" >> \"$GITHUB_ENV\"\necho \"APP_VER_DISPLAY=$version_string\"\
        \necho \"APP_VER_FULL=$app_ver_full\"\n"
    - name: Restore dependencies
      run: dotnet restore src/ui/UI.csproj
    - name: Build
      run: dotnet build src/ui/UI.csproj --configuration Release --no-restore
    - name: Download + verify static ffmpeg (${{ matrix.arch }})
      run: "set -e\ncurl -fL -o ffmpeg.zip \"${{ matrix.ffmpeg_url }}\"\necho \"${{ matrix.ffmpeg_sha256 }}  ffmpeg.zip\"\
        \ | shasum -a 256 -c -\nmkdir -p ffmpeg-temp\nunzip -o ffmpeg.zip -d ffmpeg-temp\nrm ffmpeg.zip\nif [ ! -f ffmpeg-temp/ffmpeg\
        \ ]; then\n  found=$(find ffmpeg-temp -maxdepth 3 -type f -name ffmpeg | head -1)\n  [ -n \"$found\" ] && mv \"$found\"\
        \ ffmpeg-temp/ffmpeg\nfi\nchmod +x ffmpeg-temp/ffmpeg\nfile ffmpeg-temp/ffmpeg\n# Arch sanity: fail loudly if osxexperts\
        \ ever serves a wrong-arch or\n# universal binary. `lipo -archs` returns space-separated arch names;\n# we require\
        \ an exact single-arch match (a universal \"x86_64 arm64\"\n# would not equal \"x86_64\" and would correctly fail).\n\
        archs=$(lipo -archs ffmpeg-temp/ffmpeg)\nif [ \"$archs\" != \"${{ matrix.expected_arch }}\" ]; then\n  echo \"ERROR:\
        \ ffmpeg binary archs are '$archs', expected exactly '${{ matrix.expected_arch }}'\"\n  exit 1\nfi\n"
    - name: Download + verify + extract libmpv from IINA
      run: "set -e\ncurl -fL -o iina.dmg \"https://github.com/iina/iina/releases/download/${IINA_VERSION}/IINA.${IINA_VERSION}.dmg\"\
        \necho \"${IINA_SHA256}  iina.dmg\" | shasum -a 256 -c -\nhdiutil attach iina.dmg -nobrowse -readonly -mountpoint\
        \ ./iina-mnt\nmkdir -p libmpv-temp\n# Copy every bundled dylib except Swift runtime libs (IINA itself is\n# Swift;\
        \ libmpv + its C deps don't link Swift, so these are dead weight).\nfor dylib in ./iina-mnt/IINA.app/Contents/Frameworks/*.dylib;\
        \ do\n  name=$(basename \"$dylib\")\n  case \"$name\" in\n    libswift_*) continue ;;\n  esac\n  cp -L \"$dylib\"\
        \ \"./libmpv-temp/$name\"\ndone\nhdiutil detach ./iina-mnt\nrm -f iina.dmg\n# Sanity: assert libmpv landed. Catches\
        \ a future IINA layout change\n# that would otherwise produce an empty Frameworks/ + broken DMG.\n[ -f libmpv-temp/libmpv.2.dylib\
        \ ] || {\n  echo \"ERROR: libmpv.2.dylib not extracted from IINA - did the bundle layout change?\"; exit 1;\n}\necho\
        \ \"Extracted $(ls libmpv-temp | wc -l) dylibs ($(du -sh libmpv-temp | cut -f1))\"\n"
    - name: Download + verify libvoikko + voikko-fi dictionary (${{ matrix.arch }})
      run: "set -e\ncurl -fL -o libvoikko.zip \"${{ matrix.voikko_url }}\"\necho \"${{ matrix.voikko_sha256 }}  libvoikko.zip\"\
        \ | shasum -a 256 -c -\nunzip -o libvoikko.zip -d libmpv-temp\nrm libvoikko.zip\narchs=$(lipo -archs libmpv-temp/libvoikko.1.dylib)\n\
        if [ \"$archs\" != \"${{ matrix.expected_arch }}\" ]; then\n  echo \"ERROR: libvoikko archs are '$archs', expected\
        \ exactly '${{ matrix.expected_arch }}'\"\n  exit 1\nfi\ncurl -fL -o voikko-dict.zip \"https://github.com/SubtitleEdit/support-files/releases/download/voikko-4.3-fi-2024-06/dict.zip\"\
        \necho \"98f26bb67e08288910fbf1aa92521f28bee79538ba86aefa267713333e7fa537  voikko-dict.zip\" | shasum -a 256 -c -\n\
        mkdir -p voikko-dict-temp\nunzip -o voikko-dict.zip -d voikko-dict-temp\nrm voikko-dict.zip\n[ -f voikko-dict-temp/5/mor-standard/mor.vfst\
        \ ] || { echo \"ERROR: voikko dictionary layout changed\"; exit 1; }\n"
    - name: Publish macOS app (${{ matrix.arch }})
      run: "set -e\ndotnet publish src/ui/UI.csproj -c Release -r ${{ matrix.runtime }} --self-contained true \\\n  -p:PublishSingleFile=true\
        \ \\\n  -p:DebugSymbols=false \\\n  -p:DebugType=none \\\n  -p:Version=\"$APP_VER_FULL\" \\\n  -p:FileVersion=\"$APP_VER_FULL\"\
        \ \\\n  -p:InformationalVersion=\"$APP_VER_DISPLAY\" \\\n  -o ./publish/macos-${{ matrix.arch }}\nfind ./publish/macos-${{\
        \ matrix.arch }} -name \"*.pdb\" -delete\nrm -f ./publish/macos-${{ matrix.arch }}/libse.xml\n# Arch sanity on the\
        \ cross-published SE executable (lipo: exact match).\nfile ./publish/macos-${{ matrix.arch }}/SubtitleEdit\narchs=$(lipo\
        \ -archs ./publish/macos-${{ matrix.arch }}/SubtitleEdit)\nif [ \"$archs\" != \"${{ matrix.expected_arch }}\" ]; then\n\
        \  echo \"ERROR: SubtitleEdit binary archs are '$archs', expected exactly '${{ matrix.expected_arch }}'\"\n  exit\
        \ 1\nfi\n"
    - name: Update Info.plist with version from Se.cs
      run: 'chmod +x ./installer/macBundle/update-plist-version.sh

        ./installer/macBundle/update-plist-version.sh

        '
    - name: Assemble, sign, and package DMG (${{ matrix.arch }})
      run: "set -e\napp=\"./SubtitleEdit-${{ matrix.arch_label }}.app\"\ncp -R \"./installer/macBundle/SubtitleEdit.app\"\
        \ \"$app\"\n\n# .gitkeep only exists so git tracks the empty Contents/MacOS folder.\n# codesign treats every file\
        \ in MacOS/ as code, so leaving it in place\n# makes `codesign --verify --deep --strict` fail the whole bundle with\n\
        # \"code object is not signed at all\". Unsigned builds never hit this,\n# because they strip the signature instead\
        \ of verifying it.\n# .DS_Store can arrive the same way and is unsignable for the same reason.\nfind \"$app\" \\(\
        \ -name \".gitkeep\" -o -name \".DS_Store\" \\) -delete\n\ncp \"./publish/macos-${{ matrix.arch }}/SubtitleEdit\"\
        \ \"$app/Contents/MacOS/\"\ncp \"./publish/macos-${{ matrix.arch }}/\"*.dylib \"$app/Contents/MacOS/\" 2>/dev/null\
        \ || true\nchmod +x \"$app/Contents/MacOS/SubtitleEdit\"\nrm -rf \"./publish/macos-${{ matrix.arch }}\"\n\ncp \"./ffmpeg-temp/ffmpeg\"\
        \ \"$app/Contents/MacOS/\"\nchmod +x \"$app/Contents/MacOS/ffmpeg\"\nrm -rf \"./ffmpeg-temp\"\n\nmkdir -p \"$app/Contents/Frameworks\"\
        \ncp \"./libmpv-temp/\"*.dylib \"$app/Contents/Frameworks/\"\nchmod -R 755 \"$app/Contents/Frameworks/\"\nrm -rf \"\
        ./libmpv-temp\"\n\nmkdir -p \"$app/Contents/Resources/voikko\"\ncp -R \"./voikko-dict-temp/5\" \"$app/Contents/Resources/voikko/\"\
        \nrm -rf \"./voikko-dict-temp\"\n\n# Point the SE executable at the bundled Frameworks for @rpath resolution.\n# The\
        \ dylibs themselves already use @rpath/* internally (IINA's CI fixed\n# them), so no further install_name_tool work\
        \ is needed on the libs.\nexecutable=\"$app/Contents/MacOS/SubtitleEdit\"\nif ! otool -l \"$executable\" | grep -q\
        \ \"@executable_path/../Frameworks\"; then\n  install_name_tool -add_rpath \"@executable_path/../Frameworks\" \"$executable\"\
        \ || true\nfi\n\ncodesign --remove-signature \"$app\" 2>/dev/null || true\n\ndmg_dir=\"./dmg-temp-${{ matrix.arch\
        \ }}\"\ndmg_out=\"./SubtitleEdit-macOS-${{ matrix.arch_label }}.dmg\"\nmkdir -p \"$dmg_dir\"\ncp -R \"$app\" \"$dmg_dir/Subtitle\
        \ Edit.app\"\nrm -rf \"$app\"\n\n# Ship the project's own MIT terms next to the existing third-party bundle so\n#\
        \ the DMG carries both (issue #11278).\ncp \"./LICENSE\" \"$dmg_dir/LICENSE\"\ncp \"./installer/macBundle/THIRD_PARTY_LICENSES.txt\"\
        \ \"$dmg_dir/THIRD_PARTY_LICENSES.txt\"\n\nif [ \"$SIGNING_AVAILABLE\" != \"true\" ]; then\n  cp \"./installer/macBundle/README-macOS.txt\"\
        \ \"$dmg_dir/README-macOS.txt\"\n  cp \"./installer/macBundle/fix-unsigned-app.sh\" \"$dmg_dir/fix-unsigned-app.sh\"\
        \n  chmod +x \"$dmg_dir/fix-unsigned-app.sh\"\nfi\n\nln -s /Applications \"$dmg_dir/Applications\"\n\n# `hdiutil create`\
        \ is flaky on hosted macOS runners: a freshly written\n# source folder can briefly read as \"Resource busy\" while\
        \ mds/Spotlight\n# is still touching it. Sync, then retry a few times before giving up.\nsync\nattempts=0\nuntil hdiutil\
        \ create -volname \"SubtitleEdit ${{ matrix.arch_label }}\" -srcfolder \"$dmg_dir\" -ov -format ${{ matrix.dmg_format\
        \ }} \"$dmg_out\"; do\n  attempts=$((attempts + 1))\n  if [ \"$attempts\" -ge 3 ]; then\n    echo \"::error::hdiutil\
        \ create failed after $attempts attempts\"\n    exit 1\n  fi\n  echo \"hdiutil create failed (attempt $attempts),\
        \ retrying in 5s...\"\n  sleep 5\ndone\n\n\nrm -rf \"$dmg_dir\"\n"
    - name: Upload macOS DMG
      uses: actions/upload-artifact@v5
      with:
        name: SubtitleEdit-macOS-Intel-platform-progress
        path: ./SubtitleEdit-macOS-${{ matrix.arch_label }}.dmg
        overwrite: true
        retention-days: 7
        if-no-files-found: error
    timeout-minutes: 45
